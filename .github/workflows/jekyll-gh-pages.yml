    { id: "nys",  role: "protein", cat: "1. Core Clean Proteins (6 oz — Includes 1 Side & 1 Sauce)", name: "New York Strip Steak (6 oz)", desc: "Trim performance cut seared in pure avocado oil, preset whipped garlic ghee, sea salt & Tamari kiss", price: 28, step: 0.5, max: 3, p: 41, c: 1, f: 18, qty: 0 },
    { id: "rice", role: "side",    cat: "2. Endurance Foundations (Coconut Oil) & Add-Ons", name: "Ninja Hibachi Fried Rice (1 Cup)", desc: "Jasmine rice, whole egg, unrefined coconut oil, Tamari & garlic ($7 full / $3.50 half — 1 free per 6 oz protein)", price: 7, step: 0.5, max: 3, p: 9, c: 44, f: 10, qty: 0 },
    { id: "veg",  role: "side",    cat: "2. Endurance Foundations (Coconut Oil) & Add-Ons", name: "Teppanyaki Mixed Vegetables", desc: "Fresh zucchini, onions & mushrooms in unrefined coconut oil & Tamari ($7 full / $3.50 half — 1 free per 6 oz protein)", price: 7, step: 0.5, max: 3, p: 3, c: 12, f: 7, qty: 0 },
    { id: "egg",  role: "addon",   cat: "2. Endurance Foundations (Coconut Oil) & Add-Ons", name: "Extra Egg Roll-In (2 Whole Eggs)", desc: "Pasture-raised eggs scrambled on the flat-top in pure avocado oil ($4 for 2 eggs / $2 for 1 egg)", price: 4, step: 0.5, max: 3, p: 12, c: 1, f: 11, qty: 0 },
    { id: "yum",  role: "sauce",   cat: "3. Signature Dipping Sauces (1 oz Cup — Monk Fruit Sweetened)", name: "Shinobi Sauce (Avocado Yum Yum)", desc: "Pure avocado oil mayo, zero-carb Monk Fruit, garlic & spices ($2/oz — 1 free per 6 oz protein)", price: 2, step: 0.5, max: 3, p: 0, c: 0, f: 14, qty: 0 },
    { id: "og",   role: "sauce",   cat: "3. Signature Dipping Sauces (1 oz Cup — Monk Fruit Sweetened)", name: "Citrus Orange Ginger Sauce", desc: "Blended fresh onion base (#1 ingredient), ginger root, orange zest, Tamari, olive oil & Monk Fruit ($2/oz)", price: 2, step: 0.5, max: 3, p: 1, c: 3, f: 2.5, qty: 0 },
    { id: "mus",  role: "sauce",   cat: "3. Signature Dipping Sauces (1 oz Cup — Monk Fruit Sweetened)", name: "Ancient Sesame Mustard", desc: "Blended fresh onion base (#1 ingredient), stone-ground mustard, toasted sesame, Tamari & Monk Fruit ($2/oz)", price: 2, step: 0.5, max: 3, p: 2, c: 3, f: 4, qty: 0 },
    { id: "fiji", role: "drink",   cat: "4. Clean Hydration (Whole Bottles Only)", name: "Fiji Natural Artesian Water (1 Bottle)", desc: "Silica-rich natural artesian electrolytes ($4/bottle — whole bottles only)", price: 4, step: 1, max: 6, p: 0, c: 0, f: 0, qty: 0 }
  ];
  const partyExtras = { chk: 0, nys: 0, mahi: 0, sal: 0 };
  const eventExtras = { nys: 0, mahi: 0, sal: 0, chk: 0 };
  let lastSingleText = "", lastPartyText = "", lastEventText = "";
  const calcKcal = (p, c, f) => Math.round((p * 4) + (c * 4) + (f * 9));
  const fmt = (n) => Number.isInteger(n) ? n : n.toFixed(1);
  const fmtMoney = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  window.npSwitchTab = function(tab) {
    ["single", "party", "event"].forEach(t => {
      document.getElementById("np-view-" + t).style.display = (t === tab) ? "block" : "none";
      const btn = document.getElementById("np-tab-btn-" + t);
      btn.style.background = (t === tab) ? ((t === "event") ? "#38bdf8" : "#f59e0b") : "transparent";
      btn.style.color = (t === tab) ? "#0b111e" : "#cbd5e1";
    });
  };
  window.npSetQty = function(id, val) {
    const item = NP_MENU.find(i => i.id === id);
    if (!item) return;
    let raw = parseFloat(val) || 0;
    raw = (item.step === 1) ? Math.round(raw) : Math.round(raw * 2) / 2;
    item.qty = Math.max(0, Math.min(item.max, raw));
    npRenderSingle();
  };
  window.npResetAll = function() { NP_MENU.forEach(i => { i.qty = 0; }); npRenderSingle(); };

  function npRenderSingle() {
    const categories = [...new Set(NP_MENU.map(i => i.cat))];
    const earnedCredits = Math.floor(NP_MENU.filter(i => i.role === "protein").reduce((s, i) => s + i.qty, 0));
    let remSide = earnedCredits, remSauce = earnedCredits;
    const bill = {};
    NP_MENU.forEach(item => {
      if (item.qty <= 0) { bill[item.id] = { free: 0, paid: 0, net: 0 }; return; }
      if (item.role === "side" && remSide > 0) {
        const cov = Math.min(item.qty, remSide); remSide -= cov;
        bill[item.id] = { free: cov, paid: item.qty - cov, net: (item.qty - cov) * item.price };
      } else if (item.role === "sauce" && remSauce > 0) {
        const cov = Math.min(item.qty, remSauce); remSauce -= cov;
        bill[item.id] = { free: cov, paid: item.qty - cov, net: (item.qty - cov) * item.price };
      } else {
        bill[item.id] = { free: 0, paid: item.qty, net: item.qty * item.price };
      }
    });
    let html = "";
    categories.forEach(cat => {
      html += `<div style="margin-top:16px; margin-bottom:8px; color:#38bdf8; font-size:0.82rem; font-weight:800; text-transform:uppercase; border-bottom:1px solid #26334d; padding-bottom:4px;">${cat}</div>`;
      NP_MENU.filter(i => i.cat === cat).forEach(item => {
        const baseCal = calcKcal(item.p, item.c, item.f);
        const curP = item.p * item.qty, curC = item.c * item.qty, curF = item.f * item.qty, curCal = calcKcal(curP, curC, curF);
        const b = bill[item.id];
        const halfNote = item.step === 0.5 ? `$${item.price} full (1x) / $${(item.price/2).toFixed(2).replace(/\.00$/,"")} half (0.5x)` : `$${item.price} per bottle`;
        let bTxt = b.free > 0 && b.paid === 0 ? `<span style="color:#34d399;">INCLUDED FREE (${b.free}x) — $0.00</span>` : (b.free > 0 ? `<span style="color:#34d399;">${b.free}x Free</span> + <span style="color:#f59e0b;">${b.paid}x Extra ($${b.net.toFixed(2)})</span>` : `<span style="color:#34d399;">Subtotal: $${b.net.toFixed(2)}</span>`);
        html += `<div style="background:#131c31; border:1.5px solid ${item.qty > 0 ? '#f59e0b' : '#26334d'}; border-radius:10px; padding:12px; margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div><div style="font-size:0.96rem; font-weight:700; color:#fff;">${item.name} <span style="color:#34d399; font-size:0.88rem;">$${item.price}</span></div><div style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">${item.desc}</div></div>
            <div style="background:#0b111e; border:1px solid #f59e0b; color:#f59e0b; font-weight:800; font-size:0.82rem; padding:4px 8px; border-radius:6px;">${item.qty}x</div>
          </div>
          <div style="margin-top:8px; font-size:0.74rem; color:#cbd5e1; background:#0b111e; padding:6px 8px; border-radius:6px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;">
            <span><strong>1x Base:</strong> ${baseCal} kcal &bull; P: ${fmt(item.p)}g &bull; C: ${fmt(item.c)}g &bull; F: ${fmt(item.f)}g</span><span style="color:#38bdf8; font-weight:600;">${halfNote}</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
            <button onclick="npSetQty('${item.id}', ${item.qty - item.step})" style="background:#26334d; color:#fff; border:none; width:34px; height:34px; border-radius:6px; font-size:1.1rem; font-weight:700; cursor:pointer;">-</button>
            <input type="range" min="0" max="${item.max}" step="${item.step}" value="${item.qty}" oninput="npSetQty('${item.id}', this.value)" style="flex:1; accent-color:#f59e0b; height:8px; cursor:pointer;" />
            <button onclick="npSetQty('${item.id}', ${item.qty + item.step})" style="background:#f59e0b; color:#0b111e; border:none; width:34px; height:34px; border-radius:6px; font-size:1.1rem; font-weight:800; cursor:pointer;">+</button>
          </div>
          ${item.qty > 0 ? `<div style="margin-top:8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; font-size:0.78rem; font-weight:700; color:#f59e0b; border-top:1px solid #26334d; padding-top:6px;"><span>Added (${item.qty}x):${curCal} kcal | P: ${fmt(curP)}g \vert{} C:${fmt(curC)}g | F: ${fmt(curF)}g</span><span>${bTxt}</span></div>` : ``}
        </div>`;
      });
    });
    document.getElementById("np-items-list").innerHTML = html;
    let totP = 0, totC = 0, totF = 0, totPrice = 0, activeNames = [];
    NP_MENU.forEach(i => { if (i.qty > 0) { totP += i.p * i.qty; totC += i.c * i.qty; totF += i.f * i.qty; totPrice += bill[i.id].net; activeNames.push(`${i.qty}x ${i.name}`); } });
    const totCal = calcKcal(totP, totC, totF);
    document.getElementById("np-tot-price").textContent = fmtMoney(totPrice);
    document.getElementById("np-tot-cal").textContent = totCal;
    document.getElementById("np-tot-pro").textContent = fmt(totP) + "g";
    document.getElementById("np-tot-carb").textContent = fmt(totC) + "g";
    document.getElementById("np-tot-fat").textContent = fmt(totF) + "g";
    document.getElementById("np-credit-badge").textContent = earnedCredits > 0 ? `Includes ${earnedCredits} Free Side & ${earnedCredits} Free Sauce (${remSide} side / ${remSauce} sauce left)` : "Add 1x (6 oz) Protein to unlock 1 Free Side + 1 Free Sauce";
    document.getElementById("np-plate-summary").innerHTML = activeNames.length ? "<strong>Active Plate:</strong> " + activeNames.join(" + ") : "No items selected yet — slide any item below to build your plate.";
    lastSingleText = `Hi Chef Ninja! I'd like to order a Ninja's Provisions Custom Plate:\n- Build: ${activeNames.join(" + ") || "None"}\n- Total Price: ${fmtMoney(totPrice)}\n- Macros: ${totCal} kcal | P: ${fmt(totP)}g | C: ${fmt(totC)}g | Clean Fat: ${fmt(totF)}g`;
  }

  window.npSetPartyGuests = function(d) { const s = document.getElementById("np-party-guests-slider"); s.value = Math.max(2, Math.min(49, parseInt(s.value,10) + d)); npUpdateParty(); };
  window.npSetPartyExtra = function(id, d) { partyExtras[id] = Math.max(0, Math.min(3, partyExtras[id] + d)); npUpdateParty(); };
  window.npUpdateParty = function() {
    const guests = parseInt(document.getElementById("np-party-guests-slider").value, 10) || 10;
    document.getElementById("np-party-guests-badge").textContent = guests + " Guests";
    const pro1 = PROTEINS[document.getElementById("np-party-pro-1").value], pro2 = PROTEINS[document.getElementById("np-party-pro-2").value];
    let exHtml = "", gP = pro1.p + pro2.p + 12, gC = pro1.c + pro2.c + 56, gF = pro1.f + pro2.f + 17, exCnt = 0, exLbls = [];
    Object.keys(PROTEINS).forEach(k => {
      const p = PROTEINS[k], c = partyExtras[k];
      if (c > 0) { exCnt += c; gP += p.p * c; gC += p.c * c; gF += p.f * c; exLbls.push(`${c}x Extra ${p.name}`); }
      exHtml += `<div style="display:flex; justify-content:space-between; align-items:center; background:#0b111e; border:1px solid ${c>0?'#f59e0b':'#26334d'}; padding:8px 10px; border-radius:8px; margin-bottom:6px;">
        <div><div style="font-size:0.88rem; font-weight:700; color:#fff;">+ Extra ${p.name} <span style="color:#34d399;">(+$15/guest)</span></div><div style="font-size:0.72rem; color:#94a3b8;">Adds ${calcKcal(p.p,p.c,p.f)} kcal | P: ${p.p}g | C: ${p.c}g | F: ${p.f}g</div></div>
        <div style="display:flex; align-items:center; gap:8px;"><button onclick="npSetPartyExtra('${k}',-1)" style="background:#26334d; color:#fff; border:none; width:28px; height:28px; border-radius:6px; font-weight:800;">-</button><span style="color:#f59e0b; font-weight:800; min-width:24px; text-align:center;">${c}x</span><button onclick="npSetPartyExtra('${k}',1)" style="background:#f59e0b; color:#0b111e; border:none; width:28px; height:28px; border-radius:6px; font-weight:800;">+</button></div></div>`;
    });
    document.getElementById("np-party-extras-list").innerHTML = exHtml;
    const perG = 80 + (exCnt * 15), tot = perG * guests, gCal = calcKcal(gP, gC, gF);
    document.getElementById("np-party-perperson").textContent = `${fmtMoney(perG)} / guest (${guests} guests)`;
    document.getElementById("np-party-tot-price").textContent = fmtMoney(tot);
    document.getElementById("np-party-cal").textContent = gCal; document.getElementById("np-party-pro").textContent = gP + "g"; document.getElementById("np-party-carb").textContent = gC + "g"; document.getElementById("np-party-fat").textContent = gF + "g";
    document.getElementById("np-party-summary").innerHTML = `<strong>Party Build:</strong> ${guests} Guests &bull; ${pro1.name} + ${pro2.name} + Rice + Veggies` + (exLbls.length ? ` + ${exLbls.join(", ")}` : "");
    lastPartyText = `Hi Chef Ninja! I'd like to book a Ninja's Provisions Private Party Show:\n- Guests: ${guests} (${fmtMoney(perG)}/guest)\n- Proteins: ${pro1.name} + ${pro2.name}\n- Extras: ${exLbls.join(", ") || "None"}\n- Total: ${fmtMoney(tot)}\n- Macros/Guest: ${gCal} kcal | P: ${gP}g | C: ${gC}g | F: ${gF}g`;
  };

  window.npSetEventPlates = function(d) { const s = document.getElementById("np-event-plates-slider"); s.value = Math.max(50, Math.min(500, parseInt(s.value,10) + d)); npUpdateEvent(); };
  window.npSetEventExtra = function(id, d) { eventExtras[id] = Math.max(0, Math.min(3, eventExtras[id] + d)); npUpdateEvent(); };
  window.npUpdateEvent = function() {
    const plates = Math.max(50, parseInt(document.getElementById("np-event-plates-slider").value, 10) || 50);
    document.getElementById("np-event-plates-badge").textContent = plates + " Plates";
    const tInfo = plates >= 300 ? {r:32,t:4,l:"300+ Tier ($32/pl)"} : (plates >= 200 ? {r:36,t:3,l:"200–299 Tier ($36/pl)"} : (plates >= 100 ? {r:42,t:2,l:"100–199 Tier ($42/pl)"} : {r:50,t:1,l:"50–99 Tier ($50/pl)"}));
    [1,2,3,4].forEach(t => { const el = document.getElementById("np-tier-" + t); el.style.border = (t === tInfo.t) ? "1.5px solid #34d399" : "1px solid #26334d"; el.style.background = (t === tInfo.t) ? "#152036" : "#0b111e"; });
    let exHtml = "", pP = 52, pC = 50, pF = 21, exCnt = 0, exLbls = [];
    Object.keys(PROTEINS).forEach(k => {
      const p = PROTEINS[k], c = eventExtras[k];
      if (c > 0) { exCnt += c; pP += p.p * c; pC += p.c * c; pF += p.f * c; exLbls.push(`${c}x Extra ${p.name}`); }
      exHtml += `<div style="display:flex; justify-content:space-between; align-items:center; background:#0b111e; border:1px solid ${c>0?'#38bdf8':'#26334d'}; padding:8px 10px; border-radius:8px; margin-bottom:6px;">
        <div><div style="font-size:0.88rem; font-weight:700; color:#fff;">+ Extra ${p.name} <span style="color:#34d399;">(+$15/plate)</span></div><div style="font-size:0.72rem; color:#94a3b8;">Adds ${calcKcal(p.p,p.c,p.f)} kcal | P: ${p.p}g | C: ${p.c}g | F: ${p.f}g</div></div>
        <div style="display:flex; align-items:center; gap:8px;"><button onclick="npSetEventExtra('${k}',-1)" style="background:#26334d; color:#fff; border:none; width:28px; height:28px; border-radius:6px; font-weight:800;">-</button><span style="color:#38bdf8; font-weight:800; min-width:24px; text-align:center;">${c}x</span><button onclick="npSetEventExtra('${k}',1)" style="background:#38bdf8; color:#0b111e; border:none; width:28px; height:28px; border-radius:6px; font-weight:800;">+</button></div></div>`;
    });
    document.getElementById("np-event-extras-list").innerHTML = exHtml;
    const perP = tInfo.r + (exCnt * 15), tot = perP * plates, pCal = calcKcal(pP, pC, pF), sav = (50 - tInfo.r) * plates;
    document.getElementById("np-event-savings-note").textContent = sav > 0 ? `🎉 ${tInfo.l} — Saving ${fmtMoney(sav)}!` : `Active: ${tInfo.l} (100+ plates unlocks $42/plate!)`;
    document.getElementById("np-event-perplate").textContent = `${fmtMoney(perP)} / plate (${plates} plates)`;
    document.getElementById("np-event-tot-price").textContent = fmtMoney(tot);
    document.getElementById("np-event-cal").textContent = pCal; document.getElementById("np-event-pro").textContent = pP + "g"; document.getElementById("np-event-carb").textContent = pC + "g"; document.getElementById("np-event-fat").textContent = pF + "g";
    document.getElementById("np-event-summary").innerHTML = `<strong>Event Build:</strong> ${plates} Plates (${tInfo.l}) &bull; 6 oz Chicken + 1 Cup Rice` + (exLbls.length ? ` + ${exLbls.join(", ")}` : "");
    lastEventText = `Hi Chef Ninja! I'd like an Event Quote for Ninja's Provisions:\n- Plates: ${plates} (${tInfo.l} -> ${fmtMoney(perP)}/plate)\n- Extras: ${exLbls.join(", ") || "None"}\n- Total: ${fmtMoney(tot)}\n- Macros/Plate: ${pCal} kcal | P: ${pP}g | C: ${pC}g | F: ${pF}g`;
  };

  const getMsg = (m) => m === "single" ? lastSingleText : (m === "party" ? lastPartyText : lastEventText);
  window.npCopySummary = function(m) {
    if (navigator.clipboard) navigator.clipboard.writeText(getMsg(m));
    const t = document.getElementById("np-copy-toast"); t.style.display = "block"; setTimeout(() => { t.style.display = "none"; }, 3500);
  };
  window.npSendSMS = function(m) {
    const txt = getMsg(m); if (navigator.clipboard) navigator.clipboard.writeText(txt);
    const sep = /iPad|iPhone|iPod/.test(navigator.userAgent || "") ? "&" : "?";
    window.location.href = `sms:${CHEF_PHONE}${sep}body=${encodeURIComponent(txt)}`;
  };
  npRenderSingle(); npUpdateParty(); npUpdateEvent();
})();
</script>
</body>
</html>
